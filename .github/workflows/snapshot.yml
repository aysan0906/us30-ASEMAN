name: محاسبه و ارسال نتیجه به داشبورد

on:
  schedule:
    - cron: "*/15 6-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: گرفتن کد
        uses: actions/checkout@v4

      - name: نصب پایتون
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: نصب کتابخانه ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: محاسبه و ارسال
        env:
          SITE_URL: ${{ secrets.SITE_URL || 'https://us30-aseman-1.onrender.com' }}
          SNAPSHOT_KEY: ${{ secrets.SNAPSHOT_KEY || 'aseman_us30_snapshot_2026' }}
          PYTHONUNBUFFERED: "1"
          ASSETS: "US30"
          SNAPSHOT_INTERVAL: "1d"
        run: python build_snapshot.py

      - name: کامیت انبار پشتیبان در ریپو
        continue-on-error: true
        run: |
          set -u
          if [ ! -f snapshot_cache.json ]; then
            echo "::warning::فایل پشتیبان ساخته نشد"
            exit 0
          fi
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add -f snapshot_cache.json
          if git diff --cached --quiet; then
            echo "تغییری نبود"
            exit 0
          fi
          SZ=$(wc -c < snapshot_cache.json | tr -d ' ')
          git commit -m "انبار محاسبه — ${SZ} بایت [skip render]"
          BR="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            git fetch -q origin "$BR" || true
            if ! git rebase "origin/$BR"; then
              git rebase --abort || true
            fi
            if git push origin "HEAD:refs/heads/$BR"; then
              echo "✅ انبار پشتیبان ذخیره شد"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::پوش انبار به دلیل سطح دسترسی گیت‌هاب انجام نشد (Settings → Actions → General → Read and write)"
          exit 0
