name: Render US30 24/7 Keep-Alive & Ultra-Fast Ping

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    name: Ping Render US30 & Keep Active
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Render US30 Service
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          TARGET_URL="${{ secrets.RENDER_APP_URL || 'https://us30-aseman-1.onrender.com' }}/healthz"
          echo "[$TIMESTAMP] Starting Keep-Alive ping to: $TARGET_URL"

          # Use graceful curl so cold-start timeouts never trigger an error/alarm
          HTTP_CODE=$(curl -sS -o /tmp/health_response.json -w "%{http_code}" \
            --connect-timeout 25 \
            --max-time 75 \
            "$TARGET_URL" 2>/dev/null || echo "WAKING_UP")

          echo "Ping Status / HTTP Code: $HTTP_CODE"

          if [ -f /tmp/health_response.json ] && [ -s /tmp/health_response.json ]; then
            echo "Response: $(cat /tmp/health_response.json)"
          fi

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Render US30 is fully awake and responding in milliseconds!"
          else
            echo "⚠️ First ping initiated wake-up ($HTTP_CODE). Waiting 10s and pinging root..."
            sleep 10
            ROOT_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              --connect-timeout 20 \
              --max-time 60 \
              "${{ secrets.RENDER_APP_URL || 'https://us30-aseman-1.onrender.com' }}/" 2>/dev/null || echo "BOOTING")
            echo "Root URL HTTP Code: $ROOT_CODE"
            echo "Container received wake-up signal and is active."
          fi

          exit 0

      - uses: actions/checkout@v4

      - name: Update GitHub Activity Clock
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%d %H:%M UTC" > .github/last-keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          git commit -m "chore: keepalive heartbeat [skip render]" || exit 0
          git push || true
